version: "3.9"

# =============================================================
# iTAS BackOffice — Development Docker Compose
# =============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: itas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itas_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: itas_backoffice
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itas_user -d itas_backoffice"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MinIO Object Storage (S3-compatible) ----
  minio:
    image: minio/minio:latest
    container_name: itas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Create default S3 bucket on startup ----
  minio-init:
    image: minio/mc:latest
    container_name: itas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing myminio/itas-backoffice;
        mc anonymous set download myminio/itas-backoffice/public;
        exit 0;
      "

  # ---- Redis (optional caching & rate limiting) ----
  redis:
    image: redis:7-alpine
    container_name: itas_redis
    restart: unless-stopped
    command: redis-server --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Next.js App (Development) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: itas_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://itas_user:strongpassword@postgres:5432/itas_backoffice
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: itas-backoffice
      REDIS_URL: redis://:redispassword@redis:6379
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: itas_network
